<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📂 Meu Gerenciador de Mídias</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
        }
        .header h1 {
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header h1 i { color: #e63946; }

        /* ===== UPLOAD ZONE ===== */
        .upload-zone {
            border: 3px dashed rgba(255,255,255,0.2);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.02);
            margin-bottom: 30px;
        }
        .upload-zone.dragover {
            border-color: #e63946;
            background: rgba(230,57,70,0.1);
            transform: scale(1.02);
        }
        .upload-zone i {
            font-size: 4rem;
            color: #666;
            margin-bottom: 15px;
            transition: all 0.3s;
        }
        .upload-zone:hover i { color: #e63946; transform: scale(1.1); }
        .upload-zone h2 { font-weight: 300; font-size: 1.3rem; }
        .upload-zone p { color: #888; font-size: 0.9rem; margin-top: 8px; }

        /* ===== TOOLBAR ===== */
        .toolbar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .toolbar input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 12px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }
        .toolbar input[type="text"]:focus {
            border-color: #e63946;
            background: rgba(255,255,255,0.08);
        }
        .toolbar input[type="text"]::placeholder { color: #666; }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: #e63946; color: #fff; }
        .btn-primary:hover { background: #ff6b6b; }
        .btn-outline { background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); }

        /* ===== GRID DE MÍDIAS ===== */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        /* ===== CARD DE MÍDIA ===== */
        .media-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s ease;
            position: relative;
            cursor: pointer;
        }
        .media-card:hover {
            transform: translateY(-4px);
            border-color: rgba(230,57,70,0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .media-card .preview {
            width: 100%;
            aspect-ratio: 1/1;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .media-card .preview img,
        .media-card .preview video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .media-card .preview .file-icon {
            font-size: 3rem;
            color: #666;
        }
        .media-card .preview .file-icon i { font-size: 3rem; }
        .media-card .info {
            padding: 12px 14px;
        }
        .media-card .info .name {
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-card .info .size {
            font-size: 0.65rem;
            color: #888;
            margin-top: 2px;
        }
        .media-card .info .date {
            font-size: 0.6rem;
            color: #555;
            margin-top: 2px;
        }
        .media-card .actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .media-card:hover .actions { opacity: 1; }
        .media-card .actions button {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 0.8rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .media-card .actions button:hover { background: #e63946; transform: scale(1.1); }
        .media-card .actions .copy-btn:hover { background: #4ade80; color: #000; }
        .media-card .actions .delete-btn:hover { background: #ef4444; }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 12px 28px;
            border-radius: 50px;
            font-size: 0.9rem;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show { opacity: 1; }
        .toast i { color: #4ade80; font-size: 1.1rem; }

        /* ===== STATS ===== */
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            padding: 15px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stats .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: #aaa;
        }
        .stats .stat-item span { color: #fff; font-weight: 700; }
        .stats .stat-item i { color: #e63946; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .header h1 { font-size: 1.2rem; }
            .media-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .upload-zone { padding: 25px 15px; }
            .upload-zone i { font-size: 2.5rem; }
            .toolbar input[type="text"] { min-width: 120px; }
            .btn { padding: 10px 16px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ===== HEADER ===== -->
    <div class="header">
        <h1><i class="fas fa-cloud-upload-alt"></i> Meu Gerenciador de Mídias</h1>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-outline" onclick="ordenarPorNome()"><i class="fas fa-sort-alpha-down"></i> Ordem</button>
            <button class="btn btn-outline" onclick="limparTudo()"><i class="fas fa-trash-alt"></i> Limpar</button>
        </div>
    </div>

    <!-- ===== UPLOAD ZONE ===== -->
    <div class="upload-zone" id="uploadZone">
        <i class="fas fa-cloud-upload-alt"></i>
        <h2>Arraste e solte arquivos aqui</h2>
        <p>ou clique para selecionar • Qualquer formato: imagens, vídeos, GIFs, áudios</p>
        <input type="file" id="fileInput" multiple style="display:none;" accept="image/*,video/*,audio/*,.gif,.pdf,.doc,.docx,.txt,.zip,.rar">
    </div>

    <!-- ===== STATS ===== -->
    <div class="stats" id="stats">
        <div class="stat-item"><i class="fas fa-images"></i> Arquivos: <span id="totalFiles">0</span></div>
        <div class="stat-item"><i class="fas fa-hdd"></i> Tamanho total: <span id="totalSize">0 MB</span></div>
        <div class="stat-item"><i class="fas fa-clock"></i> Último upload: <span id="lastUpload">Nenhum</span></div>
    </div>

    <!-- ===== TOOLBAR ===== -->
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="🔍 Buscar arquivo..." oninput="buscarArquivos()">
        <button class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
            <i class="fas fa-plus"></i> Enviar
        </button>
        <button class="btn btn-outline" onclick="copiarTodosLinks()">
            <i class="fas fa-copy"></i> Copiar Todos
        </button>
    </div>

    <!-- ===== GRID DE MÍDIAS ===== -->
    <div class="media-grid" id="mediaGrid"></div>

</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Copiado!</span></div>

<script>
    // ============================================================
    // CONFIGURAÇÕES
    // ============================================================
    const STORAGE_KEY = 'meus_arquivos';
    let arquivos = [];

    // ============================================================
    // CARREGAR DADOS
    // ============================================================
    function carregarDados() {
        try {
            const data = localStorage.getItem(STORAGE_KEY);
            arquivos = data ? JSON.parse(data) : [];
        } catch (e) {
            arquivos = [];
        }
        renderizar();
    }

    function salvarDados() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arquivos));
        renderizar();
    }

    // ============================================================
    // FORMATAR TAMANHO
    // ============================================================
    function formatarTamanho(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // ============================================================
    // GERAR ID ÚNICO
    // ============================================================
    function gerarId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // ============================================================
    // ADICIONAR ARQUIVOS
    // ============================================================
    function adicionarArquivos(files) {
        const novos = [];

        for (const file of files) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const arquivo = {
                    id: gerarId(),
                    nome: file.name,
                    tamanho: file.size,
                    tipo: file.type || 'unknown',
                    data: e.target.result,
                    dataUpload: new Date().toISOString()
                };
                novos.push(arquivo);

                if (novos.length === files.length) {
                    // Ordenar para os mais recentes primeiro
                    arquivos = [...novos, ...arquivos];
                    salvarDados();
                    mostrarToast(`✅ ${novos.length} arquivo(s) enviado(s)!`);
                }
            };
            reader.readAsDataURL(file);
        }

        if (files.length === 0) {
            mostrarToast('⚠️ Nenhum arquivo selecionado');
        }
    }

    // ============================================================
    // EXCLUIR ARQUIVO
    // ============================================================
    function excluirArquivo(id) {
        if (!confirm('❌ Tem certeza que quer excluir este arquivo?')) return;
        arquivos = arquivos.filter(a => a.id !== id);
        salvarDados();
        mostrarToast('🗑️ Arquivo removido!');
    }

    // ============================================================
    // COPIAR LINK
    // ============================================================
    function copiarLink(id) {
        const arquivo = arquivos.find(a => a.id === id);
        if (!arquivo) return;

        // Criar um link temporário para o arquivo
        const link = document.createElement('a');
        link.href = arquivo.data;
        link.download = arquivo.nome;
        link.style.display = 'none';
        document.body.appendChild(link);

        // Copiar o link DATA URL
        navigator.clipboard.writeText(arquivo.data)
            .then(() => {
                mostrarToast(`📋 Link do "${arquivo.nome}" copiado!`);
            })
            .catch(() => {
                // Fallback: mostrar o link
                prompt('Copie o link abaixo:', arquivo.data);
            });

        document.body.removeChild(link);
    }

    // ============================================================
    // COPIAR TODOS OS LINKS
    // ============================================================
    function copiarTodosLinks() {
        if (arquivos.length === 0) {
            mostrarToast('⚠️ Nenhum arquivo para copiar');
            return;
        }

        const links = arquivos.map(a => ({
            nome: a.nome,
            link: a.data
        }));

        const texto = links.map(l => `${l.nome}: ${l.link}`).join('\n\n');

        navigator.clipboard.writeText(texto)
            .then(() => {
                mostrarToast(`📋 ${links.length} links copiados!`);
            })
            .catch(() => {
                prompt('Copie os links abaixo:', texto);
            });
    }

    // ============================================================
    // BAIXAR ARQUIVO
    // ============================================================
    function baixarArquivo(id) {
        const arquivo = arquivos.find(a => a.id === id);
        if (!arquivo) return;

        const link = document.createElement('a');
        link.href = arquivo.data;
        link.download = arquivo.nome;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        mostrarToast(`📥 Baixando "${arquivo.nome}"...`);
    }

    // ============================================================
    // ORDENAR POR NOME
    // ============================================================
    function ordenarPorNome() {
        arquivos.sort((a, b) => a.nome.localeCompare(b.nome));
        salvarDados();
        mostrarToast('📂 Ordenado por nome!');
    }

    // ============================================================
    // BUSCAR ARQUIVOS
    // ============================================================
    function buscarArquivos() {
        const termo = document.getElementById('searchInput').value.toLowerCase().trim();
        renderizar(termo);
    }

    // ============================================================
    // LIMPAR TUDO
    // ============================================================
    function limparTudo() {
        if (!confirm('⚠️ Tem certeza que quer excluir TODOS os arquivos?')) return;
        if (!confirm('💀 ÚLTIMA CHANCE! Isso não pode ser desfeito!')) return;
        arquivos = [];
        salvarDados();
        mostrarToast('🧹 Todos os arquivos removidos!');
    }

    // ============================================================
    // RENDERIZAR
    // ============================================================
    function renderizar(filtro = '') {
        const grid = document.getElementById('mediaGrid');
        const total = document.getElementById('totalFiles');
        const totalSize = document.getElementById('totalSize');
        const lastUpload = document.getElementById('lastUpload');

        let lista = arquivos;

        // Filtrar
        if (filtro) {
            lista = arquivos.filter(a => a.nome.toLowerCase().includes(filtro));
        }

        // Estatísticas
        total.textContent = arquivos.length;
        const tamanhoTotal = arquivos.reduce((acc, a) => acc + a.tamanho, 0);
        totalSize.textContent = formatarTamanho(tamanhoTotal);

        if (arquivos.length > 0) {
            const ultimo = new Date(arquivos[0].dataUpload);
            lastUpload.textContent = ultimo.toLocaleString('pt-BR');
        } else {
            lastUpload.textContent = 'Nenhum';
        }

        // Grid
        if (lista.length === 0) {
            grid.innerHTML = `
                <div style="grid-column:1/-1; text-align:center; padding:60px 20px; color:#666;">
                    <i class="fas fa-folder-open" style="font-size:3rem; margin-bottom:15px; display:block;"></i>
                    <p style="font-size:1.1rem;">Nenhum arquivo encontrado</p>
                    <p style="font-size:0.85rem; color:#555;">Envie arquivos para começar</p>
                </div>
            `;
            return;
        }

        grid.innerHTML = lista.map(a => {
            const isImage = a.tipo.startsWith('image/');
            const isVideo = a.tipo.startsWith('video/');
            const isAudio = a.tipo.startsWith('audio/');
            const extensao = a.nome.split('.').pop().toUpperCase();
            const data = new Date(a.dataUpload).toLocaleString('pt-BR');

            let preview = '';
            if (isImage) {
                preview = `<img src="${a.data}" alt="${a.nome}" loading="lazy">`;
            } else if (isVideo) {
                preview = `<video src="${a.data}" muted playsinline loading="lazy"></video>`;
            } else if (isAudio) {
                preview = `<div class="file-icon"><i class="fas fa-music"></i></div>`;
            } else {
                preview = `<div class="file-icon"><i class="fas fa-file"></i></div>`;
            }

            return `
                <div class="media-card" onclick="baixarArquivo('${a.id}')">
                    <div class="preview">
                        ${preview}
                    </div>
                    <div class="actions">
                        <button class="copy-btn" onclick="event.stopPropagation(); copiarLink('${a.id}')" title="Copiar link">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="delete-btn" onclick="event.stopPropagation(); excluirArquivo('${a.id}')" title="Excluir">
                            <i class="fas fa-trash"></i>
                        </button>
                        <button onclick="event.stopPropagation(); baixarArquivo('${a.id}')" title="Baixar">
                            <i class="fas fa-download"></i>
                        </button>
                    </div>
                    <div class="info">
                        <div class="name">${a.nome}</div>
                        <div class="size">${formatarTamanho(a.tamanho)} • ${extensao}</div>
                        <div class="date">${data}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ============================================================
    // TOAST
    // ============================================================
    function mostrarToast(msg) {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        toastMsg.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // ============================================================
    // EVENTOS DE UPLOAD
    // ============================================================
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');

    uploadZone.addEventListener('click', () => fileInput.click());

    uploadZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
        uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
            adicionarArquivos(e.dataTransfer.files);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            adicionarArquivos(e.target.files);
            fileInput.value = '';
        }
    });

    // ============================================================
    // INICIAR
    // ============================================================
    carregarDados();

    console.log('📂 Gerenciador de Mídias');
    console.log(`📁 ${arquivos.length} arquivo(s) carregado(s)`);
    console.log('💾 Dados salvos no localStorage');
    console.log('🔗 Clique em COPIAR para pegar o link de qualquer arquivo');
</script>

</body>
</html>
